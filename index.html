<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Instructor Prep — Révision Moniteur Plongée</title>
  <meta name="description" content="Révise et mémorise les fondamentaux du monitorat de plongée (parcours SSI) : quiz, fiches mémo, suivi de progression." />
  <meta name="theme-color" content="#072a4a" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-flag" aria-hidden="true"></span>
        <div>
          <h1>Instructor Prep</h1>
          <p class="subtitle" data-i18n="subtitle">Révision moniteur de plongée · parcours SSI</p>
        </div>
      </div>
      <button id="lang-toggle" class="lang-toggle" type="button" aria-label="Passer l'application en anglais">
        <span id="lang-toggle-label">EN</span>
      </button>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabbar" aria-label="Navigation principale">
      <div class="tabbar-glass" aria-hidden="true"></div>
      <button class="tab" data-route="home" aria-current="page">
        <span class="tab-icon">🏠</span><span data-i18n="navHome">Accueil</span>
      </button>
      <button class="tab" data-route="quiz">
        <span class="tab-icon">📝</span><span data-i18n="navQuiz">Réviser</span>
      </button>
      <button class="tab" data-route="memo">
        <span class="tab-icon">📌</span><span data-i18n="navMemo">Fiches mémo</span>
      </button>
      <button class="tab" data-route="progress">
        <span class="tab-icon">📊</span><span data-i18n="navProgress">Progression</span>
      </button>
    </nav>
  </div>

  <div id="install-toast" class="install-toast" hidden>
    <span data-i18n="installToast">Installer Instructor Prep sur cet appareil ?</span>
    <div class="install-toast-actions">
      <button id="install-btn" class="btn btn-primary" data-i18n="installBtn">Installer</button>
      <button id="install-dismiss" class="btn btn-ghost" data-i18n="installDismiss">Plus tard</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
